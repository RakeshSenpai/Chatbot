<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Image-Generator</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fa-solid fa-wand-sparkles"></i>
                </div>
                <h1>Image-Generator</h1>
            </div>
            <button class="theme-toggle">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        <div class="main-content">
            <form action="#" class="prompt-form">
                <div class="prompt-container">
                    <textarea class="prompt-input" placeholder="Describe Your imagination..." required autofocus ></textarea>
                    <button class="prompt-btn">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>
                <!-- Prompt action buttons -->
                <div class="prompt-action">
                    <div class="select-wrapper">
                        <select class="custom-select">
                            <option value="" selected disabled>Select Model</option>

                            <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>

                            <option value="black-forest-labs/FLUX.1-schnell">
                            FLUX.1-schnell
                            </option>

                            <option value="stabilityai/stable-diffusion-xl-base-1.0">
                            Stable Diffusion XL
                            </option>

                            <option value="runwayml/stable-diffusion-v1-5">
                            Stable Diffusion v1.5
                            </option>

                            <option value="prompthero/openjourney">
                            Openjourney
                            </option>
                        </select>
                    </div>
                    <div class="select-wrapper">
                        <select class="custom-select">
                            <option value="" selected disabled>Image Count</option>
                            <option value="1">1 Image</option>
                            <option value="2">2 Image</option>
                            <option value="3">3 Image</option>
                            <option value="4">4 Image</option>
                        </select>
                    </div>
                    <div class="select-wrapper">
                        <select class="custom-select">
                            <option value="" selected disabled>Aspect Ratio</option>
                            <option value="1/1">Square(1:1)</option>
                            <option value="16/9">Landscape (16:9)</option>
                            <option value="9/16">Portrait (9:16)</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="random.js"></script>
</body>
</html>
