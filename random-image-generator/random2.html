<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="random2.css">
<title>AI Image Generator</title>

</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">✦</div>
      <h1>AI Image Generator</h1>
    </div>
    <button class="settings-btn" title="Settings">⚙</button>
  </div>

  <!-- Prompt -->
  <div class="prompt-box">
    <textarea id="prompt" placeholder="A floating island with waterfalls pouring into clouds below" rows="2"></textarea>
    <button class="attach-btn" title="Attach">📎</button>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Controls -->
  <div class="controls">
    <div class="select-wrapper">
      <select id="modelSelect">
        <option value="flux">FLUX.1-dev</option>
        <option value="sd3">SD 3.5 Large</option>
        <option value="sdxl">SDXL</option>
        <option value="dalle3">DALL·E 3</option>
      </select>
    </div>
    <div class="select-wrapper">
      <select id="countSelect">
        <option value="1">1 Image</option>
        <option value="2">2 Images</option>
        <option value="4" selected>4 Images</option>
      </select>
    </div>
    <div class="select-wrapper">
      <select id="ratioSelect">
        <option value="1:1" selected>Square (1:1)</option>
        <option value="16:9">Landscape (16:9)</option>
        <option value="9:16">Portrait (9:16)</option>
        <option value="4:3">Classic (4:3)</option>
      </select>
    </div>
    <button class="generate-btn" id="generateBtn" onclick="generate()">
      ✦ Generate
    </button>
  </div>

  <!-- Grid -->
  <div id="gridContainer">
    <div class="empty-grid" id="emptyGrid">
      <div class="empty-card">🖼</div>
      <div class="empty-card">🖼</div>
      <div class="empty-card">🖼</div>
      <div class="empty-card">🖼</div>
    </div>
    <div class="image-grid" id="imageGrid" style="display:none;"></div>
  </div>
</div>

<script src="random2.js"></script>
</body>
</html>
